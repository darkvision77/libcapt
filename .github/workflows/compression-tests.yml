name: Compression tests
on: [push, pull_request]

jobs:
  Ubuntu:
    name: ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install apt packages
        run: |
          sudo apt-get update -y --fix-missing
          sudo apt-get install -y cmake gcc pkg-config ninja-build poppler-utils gdb ghostscript libgtest-dev libgmock-dev

      - name: Install captfilter deps
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install libpopt0:i386

      - name: Configure
        run: cmake -G Ninja -S. -B build -DSANITIZE=ON -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=ON -DCOMPRESSION_TESTS=ON

      - name: Compile
        run: cmake --build build -v -j

      - name: Run compression tests
        run: ctest --test-dir build --output-on-failure -j -L compression
